[package]
name = "bookmarks-guest"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"

# Independent guest; the host supplies the SDK cache through --plugin-cargo.
[workspace]
[lib]
crate-type = ["cdylib"]
[dependencies]
plugin-protocol = { version = "=0.2.0", features = ["guest"] }
serde_json = "1.0"
