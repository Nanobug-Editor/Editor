[package]
name = "capability-example-guest"
version = "0.19.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"

# This SDK consumer owns its workspace, including Windows extended-path builds.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Resolve the published contract through the editor's public --plugin-cargo entry point.
plugin-protocol = { version = "=0.2.0", features = ["guest"] }
serde_json = "1.0"
# Typed custom service parameters reject unknown fields independently of the host schema validator.
serde = { version = "1.0", features = ["derive"] }
