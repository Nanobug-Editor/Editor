[package]
name = "workspace-converter-guest"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"

# Conversion policy is an independent guest, with no repository path dependency or SDK source copy.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
plugin-protocol = { version = "=0.2.0", features = ["guest"] }
serde_json = "1.0"
