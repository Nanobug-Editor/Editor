[package]
name = "secret-candidate-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

# The host supplies its public SDK; this fixture never links repository crates or copies SDK source.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
plugin-protocol = { version = "=0.2.0", features = ["guest"] }
serde_json = "1.0"
