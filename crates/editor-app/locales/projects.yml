_version: 2
projects.welcome:
  en: "Start your work"
  zh-CN: "开始你的工作"
projects.open_folder:
  en: "Open folder"
  zh-CN: "打开文件夹"
projects.projects:
  en: "Projects"
  zh-CN: "项目"
projects.subtitle:
  en: "Open a folder or continue a recent project."
  zh-CN: "打开文件夹，或继续最近的项目。"
projects.recent:
  en: "Recent projects"
  zh-CN: "最近项目"
projects.remove_recent:
  en: "Remove from recent projects"
  zh-CN: "从最近项目中移除"
projects.close_project:
  en: "Close project"
  zh-CN: "关闭项目"
projects.home:
  en: "Projects home"
  zh-CN: "项目首页"
projects.quit_application:
  en: "Quit application"
  zh-CN: "退出应用"
projects.trust_question:
  en: "Do you trust this project?"
  zh-CN: "是否信任此项目？"
projects.trust_details:
  en: "Trusted projects can start plugins and language tools. Restricted mode allows editing without starting them."
  zh-CN: "信任后可启动插件和语言工具；受限模式仍可查看与编辑文件。"
projects.trust:
  en: "Trust and open"
  zh-CN: "信任并打开"
projects.restricted:
  en: "Open in restricted mode"
  zh-CN: "以受限模式打开"
projects.close_question:
  en: "Close this project?"
  zh-CN: "关闭此项目？"
projects.unsaved_details:
  en: "This project contains unsaved changes."
  zh-CN: "此项目有尚未保存的修改。"
projects.running_details:
  en: "Closing will stop this project's running tasks and terminal programs."
  zh-CN: "确认关闭会停止此项目运行中的任务与终端程序。"
projects.save_close:
  en: "Save and close"
  zh-CN: "保存并关闭"
projects.discard_close:
  en: "Discard changes and close"
  zh-CN: "放弃修改并关闭"
projects.stop_close:
  en: "Stop and close"
  zh-CN: "停止并关闭"
projects.changed_before_close:
  en: "The document changed. Review the close decision again."
  zh-CN: "文档已发生变化，请重新确认关闭决定。"
projects.changed_before_open:
  en: "The selected folder changed. Select the project again."
  zh-CN: "所选目录已发生变化，请重新选择项目。"
projects.closing:
  en: "Saving project state and releasing resources…"
  zh-CN: "正在保存项目状态并释放资源…"
projects.disk_conflict:
  en: "The file changed on disk or is unavailable: %{path}. Cancel closing and resolve it before saving."
  zh-CN: "文件在磁盘上已发生变化或不可读取：%{path}。请取消关闭，处理后再保存。"
projects.failure:
  en: "The operation could not complete: %{details}"
  zh-CN: "操作未完成：%{details}"
projects.external_quitting:
  en: "Nanobug is exiting. Wait for it to finish or cancel exiting, then try opening the project again."
  zh-CN: "Nanobug 正在退出。请等待退出完成或取消退出，再重新打开项目。"
projects.external_busy:
  en: "This project has a pending close decision. Complete or cancel it, then try opening again."
  zh-CN: "此项目正在确认或执行关闭。请完成或取消关闭，再重新打开。"
projects.external_failure:
  en: "The project request could not be completed. Review the details and try again."
  zh-CN: "项目打开请求未能完成。请查看原因后重试。"
projects.external_dismiss:
  en: "Close"
  zh-CN: "关闭"
projects.launch_duplicate_profile:
  en: "Select only one GUI profile."
  zh-CN: "一次启动只能选择一个应用 profile。"
projects.launch_missing_profile:
  en: "Supply a directory after --profile."
  zh-CN: "请在 --profile 后提供目录。"
projects.launch_empty_profile:
  en: "The GUI profile directory cannot be empty."
  zh-CN: "应用 profile 目录不能为空。"
projects.launch_unknown_option:
  en: "Unknown GUI option: %{option}."
  zh-CN: "无法识别的启动选项：%{option}。"
projects.launch_multiple_targets:
  en: "Supply only one project or file target."
  zh-CN: "一次启动只能提供一个项目或文件路径。"
projects.launch_missing_default_profile:
  en: "The user profile directory is unavailable."
  zh-CN: "无法取得用户 profile 目录。"
projects.external_invalid_path:
  en: "The incoming path is invalid or too long."
  zh-CN: "收到的路径无效或过长。"
projects.external_absolute_path:
  en: "The incoming project or file path must be absolute."
  zh-CN: "收到的项目或文件路径必须是绝对路径。"
projects.external_delivery_failed:
  en: "The running application did not confirm delivery. Retry after it responds or exits. %{details}"
  zh-CN: "正在运行的应用未确认接收请求。请等待其响应或退出后重试。%{details}"
projects.external_frame_quota:
  en: "The open request or endpoint information exceeds the size limit."
  zh-CN: "打开请求或应用端点信息超出大小限制。"
projects.external_randomness:
  en: "The system could not prepare a private request session: %{details}."
  zh-CN: "系统无法准备私有请求会话：%{details}。"
projects.external_worker:
  en: "The application could not start receiving project requests."
  zh-CN: "应用无法启动项目请求接收服务。"
projects.external_invalid_session:
  en: "The request does not belong to the current application session."
  zh-CN: "请求不属于当前应用会话。"
projects.external_queue_busy:
  en: "The application cannot accept more requests right now. Please retry shortly."
  zh-CN: "应用暂时无法接收更多请求，请稍后重试。"
projects.external_dispatch_exited:
  en: "The application exited before handling the open request. Please retry."
  zh-CN: "应用在处理打开请求前已退出，请重试。"
projects.external_dispatch_expired:
  en: "The open request was not handled in time. Please retry."
  zh-CN: "打开请求未能及时处理，请重试。"
projects.external_endpoint_unsupported:
  en: "The running application's request endpoint is unsupported. Restart it and try again."
  zh-CN: "不支持正在运行的应用端点，请重启应用后重试。"
