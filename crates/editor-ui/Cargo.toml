[package]
name = "editor-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# Native verification helpers use ordinary GPUI window dispatch, never Kit's test facade.
test-support = []

[dependencies]
gpui-kit.workspace = true
gpui-base = "=0.8.1"
plugin-schema.workspace = true
# Prompt ownership and declarative data remain the existing public runtime/protocol contracts.
plugin-runtime = { path = "../plugin-runtime" }
platform-windows = { path = "../platform-windows" }
raw-window-handle = "0.6.2"
rust-i18n.workspace = true
tracing = "0.1"
# Normalize the locked Windows backend's logical glyph stream with the existing UAX #9 implementation.
unicode-bidi = "=0.3.18"
# Native color glyphs are dispatched to the existing GPUI UI executor, never a shared GPU context on workers.
futures = "0.3"
# The bounded tree artwork resolver preserves literal multicolor SVGs.
resvg = "=0.45.1"

[dev-dependencies]
# Match Kit 0.8.1's locked GPUI family without activating its weak component reference.
gpui-base = { version = "=0.8.1", features = ["test-support"] }
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["test-support"] }
lsp-types = "0.97.0"
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[target.'cfg(windows)'.dev-dependencies]
# Native drag acceptance drives the real modal move loop and observes its window bounds.
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
