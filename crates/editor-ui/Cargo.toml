[package]
name = "editor-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# Native verification helpers use ordinary GPUI window dispatch, never Kit's test facade.
test-support = []

[dependencies]
gpui-kit.workspace = true
gpui-base = "=0.8.0"
plugin-schema.workspace = true
# Prompt ownership and declarative data remain the existing public runtime/protocol contracts.
plugin-runtime = { path = "../plugin-runtime" }
platform-windows = { path = "../platform-windows" }
raw-window-handle = "0.6.2"
rust-i18n.workspace = true
tracing = "0.1"
# The bounded tree artwork resolver preserves literal multicolor SVGs.
resvg = "=0.45.1"

[dev-dependencies]
# Match Kit 0.8.0's locked GPUI family without activating its weak component reference.
gpui-base = { version = "=0.8.0", features = ["test-support"] }
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["test-support"] }
lsp-types = "0.97.0"
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
