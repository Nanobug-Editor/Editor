  zh-CN: "仍然删除，不保留此次历史"
history.delete_protection_failed:
  en: "Deletion stopped because history protection failed: %{error}"
  zh-CN: "历史保护失败，已停止删除：%{error}"
history.unavailable_delete:
  en: "Local history storage is unavailable"
  zh-CN: "本地历史存储不可用"
history.delete_budget:
  en: "The deletion protection metadata exceeds its memory budget. Delete smaller batches or explicitly proceed without this backup."
  zh-CN: "删除保护的元数据超出内存预算。请分批删除，或明确选择不保留此次历史仍然删除。"
history.cancelled:
  en: "History operation cancelled"
  zh-CN: "历史操作已取消"
