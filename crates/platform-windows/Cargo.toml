[package]
name = "platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dirs.workspace = true
editor-core = { path = "../editor-core" }
editor-history = { path = "../editor-history" }
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# COM implementation macros require the same core crate already locked by the Windows bindings.
windows-core = "=0.62.2"
# Reuse GPUI's locked Windows bindings for cancellable, STA-owned common dialogs.
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security_Credentials"] }

