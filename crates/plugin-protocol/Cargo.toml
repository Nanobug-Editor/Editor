[package]
name = "plugin-protocol"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[features]
guest = ["dep:wit-bindgen"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = { version = "1", features = ["serde"] }
# Reuse the workspace's locked Unicode algorithm for public native text boundary validation.
unicode-segmentation = "=1.13.3"
wit-bindgen = { version = "0.45.1", optional = true }
