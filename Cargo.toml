[workspace]
members = [
    "crates/editor-app",
    "crates/editor-ui",
    "crates/editor-terminal",
    "crates/editor-core",
    "crates/editor-history",
    "crates/platform-windows",
    "crates/plugin-schema",
    "crates/plugin-protocol",
    "crates/plugin-runtime",
]
# Test-only SDK consumers build independently through the host-managed public SDK cache.
# Cargo exclusions name each actual package root; excluding only their parent does not detach guests.
exclude = [
    "crates/plugin-runtime/tests/fixtures/tool-metadata",
    "crates/plugin-runtime/tests/fixtures/context-selection",
    "crates/plugin-runtime/tests/fixtures/lifecycle-http",
    "crates/plugin-runtime/tests/fixtures/lifecycle-editor",
    "crates/plugin-runtime/tests/fixtures/sdk-completion",
    "crates/plugin-runtime/tests/fixtures/community/bookmarks",
    "crates/plugin-runtime/tests/fixtures/community/capability-example",
    "crates/plugin-runtime/tests/fixtures/community/cloud-translation",
    "crates/plugin-runtime/tests/fixtures/community/code-host-query",
    "crates/plugin-runtime/tests/fixtures/community/config-check",
    "crates/plugin-runtime/tests/fixtures/community/coverage",
    "crates/plugin-runtime/tests/fixtures/community/database-tree",
    "crates/plugin-runtime/tests/fixtures/community/expression-language",
    "crates/plugin-runtime/tests/fixtures/community/generated-preview",
    "crates/plugin-runtime/tests/fixtures/community/history-preview",
    "crates/plugin-runtime/tests/fixtures/community/keyvalue-language",
    "crates/plugin-runtime/tests/fixtures/community/keyvalue-language/server",
    "crates/plugin-runtime/tests/fixtures/community/spell-check",
    "crates/plugin-runtime/tests/fixtures/community/todo-tree",
    "crates/plugin-runtime/tests/fixtures/community/workspace-converter",
    "crates/plugin-runtime/tests/fixtures/community/workspace-scaffold",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
dirs = "6.0"
# UI behavior comes from Base; styled components and bundled native grammars stay disabled.
# Base 0.8 exposes the original input display map, avoiding hidden full-source validation paints.
gpui-kit = { version = "=0.8.0", default-features = false, features = ["assets"] }
ignore = "0.4"
# Native ReadDirectoryChangesW, FSEvents, and inotify backends watch the workspace.
notify = "8.2"
# Sorting the explorer by Chinese pronunciation needs a real reading, not a
# codepoint approximation. `plain` gives toneless ASCII syllables; the tone
# spellings would sort "chang" and "cháng" apart for no benefit.
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
# Shared declarative formats and the public protocol contracts live at the bottom of the graph.
plugin-schema = { path = "crates/plugin-schema" }
rust-i18n = "4.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
toml = "0.9"
